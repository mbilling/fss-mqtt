name: Web

# The web version (src/web.rs) on GitHub Pages: built on pull requests that
# touch it, published with each release (and by hand). The pacman repository
# (packaging/arch) is published with it, under /arch.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "web/**"
      - "Cargo.*"
      - "packaging/arch/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.0
  TRUNK_SHA256: f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2

jobs:
  build:
    name: build (trunk)
    runs-on: ubuntu-latest
    # A tag's pacman repository waits for its release's builds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -fsSL -o trunk.tar.gz \
            "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$TRUNK_SHA256  trunk.tar.gz" | sha256sum -c -
          tar -xzf trunk.tar.gz -C "$RUNNER_TEMP"
          rm trunk.tar.gz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        run: trunk build web/index.html --release --locked --dist dist --public-url "/${GITHUB_REPOSITORY#*/}/"
      - name: Report size
        run: |
          size=$(stat -c %s dist/*.wasm)
          echo "Web version: $((size / 1024)) KiB of wasm" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pacman repository
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH_GPG_KEY: ${{ secrets.ARCH_GPG_KEY }}
        run: |
          # The release: this tag's, or (by hand, or on a PR) the latest.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/}
          else
            tag=$(gh release view --json tagName -q .tagName)
          fi
          # A tag's release is being built alongside: wait for its checksums.
          for _ in $(seq 1 90); do
            gh release download "$tag" -p SHA256SUMS -O SHA256SUMS --clobber 2>/dev/null && break
            sleep 20
          done
          test -s SHA256SUMS
          docker run --rm -e ARCH_GPG_KEY -v "$PWD:/src" -w /src archlinux:base-devel bash -c '
            set -euo pipefail
            if [ -n "$ARCH_GPG_KEY" ]; then
              printf "%s\n" "$ARCH_GPG_KEY" | gpg --batch --import
              export GPGKEY=$(gpg --list-secret-keys --with-colons | awk -F: "/^fpr/ { print \$10; exit }")
            fi
            packaging/arch/build-repo.sh "${1#v}" SHA256SUMS dist/arch
          ' _ "$tag"
          if [ -z "$ARCH_GPG_KEY" ]; then
            echo "Pacman repository for $tag: **unsigned** (no ARCH_GPG_KEY secret)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pacman repository for $tag: signed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' # nothing deploys a PR's
        with:
          path: dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
