name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build and publish.
#
# Package-manager publishing is opt-in; each job runs only when its repository
# variable is set (Settings → Secrets and variables → Actions):
#   Homebrew  vars.HOMEBREW_TAP   = "<owner>/homebrew-tap"   + secrets.HOMEBREW_TAP_TOKEN
#   Scoop     vars.SCOOP_BUCKET   = "<owner>/scoop-bucket"   + secrets.SCOOP_BUCKET_TOKEN
#   winget    vars.WINGET_ID      = "<Publisher>.FssMqtt"    + secrets.WINGET_TOKEN
# See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, linux: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, linux: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.linux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' # cross-built on an arm64 runner
        shell: bash
        run: target/${{ matrix.target }}/release/fss-mqtt --version
      - name: Package archive
        shell: bash
        run: scripts/package.sh ${{ matrix.target }} "$VERSION"
      - name: Package .deb and .rpm
        if: matrix.linux
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: fss-mqtt ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sums
          path: dist/SHA256SUMS

  homebrew:
    name: publish Homebrew formula
    needs: [check, release]
    if: vars.HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sums
      - name: Generate formula
        run: scripts/homebrew-formula.sh "${{ needs.check.outputs.version }}" "$GITHUB_REPOSITORY" SHA256SUMS > fss-mqtt.rb
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit to tap
        run: |
          mkdir -p tap/Formula
          cp fss-mqtt.rb tap/Formula/fss-mqtt.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fss-mqtt.rb
          git commit -m "fss-mqtt ${{ needs.check.outputs.version }}" || echo "formula unchanged"
          git push

  scoop:
    name: publish Scoop manifest
    needs: [check, release]
    if: vars.SCOOP_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sums
      - name: Generate manifest
        run: scripts/scoop-manifest.sh "${{ needs.check.outputs.version }}" "$GITHUB_REPOSITORY" SHA256SUMS > fss-mqtt.json
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SCOOP_BUCKET }}
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket
      - name: Commit to bucket
        run: |
          mkdir -p bucket/bucket
          cp fss-mqtt.json bucket/bucket/fss-mqtt.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/fss-mqtt.json
          git commit -m "fss-mqtt ${{ needs.check.outputs.version }}" || echo "manifest unchanged"
          git push

  winget:
    name: submit to winget
    needs: [check, release]
    if: vars.WINGET_ID != ''
    runs-on: windows-latest
    steps:
      # Opens a PR against microsoft/winget-pkgs from your fork. The package must
      # already exist there (first version submitted by hand; see RELEASING.md).
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ vars.WINGET_ID }}
          version: ${{ needs.check.outputs.version }}
          installers-regex: 'x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
