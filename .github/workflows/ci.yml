name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: clippy (platform-specific code)
        if: runner.os != 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  e2e:
    name: end-to-end (mosquitto, TLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          sudo systemctl stop mosquitto || true
      - name: Start brokers
        run: scripts/e2e-brokers.sh "$RUNNER_TEMP/brokers"
      - name: Run e2e test
        run: cargo test --locked --release e2e -- --ignored --nocapture
        env:
          FSS_TEST_CA: ${{ runner.temp }}/brokers/ca.pem

  size:
    name: release binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y -qq musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Report size
        run: |
          size=$(stat -c %s target/x86_64-unknown-linux-musl/release/fss-mqtt)
          echo "Static Linux x86_64 binary: $((size / 1024)) KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          # Guard against accidental bloat (e.g. a heavy new dependency).
          test "$size" -lt $((3 * 1024 * 1024))
